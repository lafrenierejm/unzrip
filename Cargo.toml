[package]
name = "unzrip"
description = "Unzip implementation with parallel decompression and automatic detection encoding"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["zip-parser"]

[features]
default = ["zstd-sys"]
zstd-sys = ["zstd"]

[dependencies]
zip-parser = { path = "zip-parser" }

# tools
anyhow = "1"
argh = "0.1"
bstr = "1"

# fast
rayon = "1"
memmap2 = "0.9"

# check
crc32fast = "1"

# compress
flate2 = "1"

# encoding
encoding_rs = "0.8"
chardetng = "0.1"

# time
time = "0.3"
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
zstd = { version = "0.13", features = ["pkg-config"], optional = true }

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
assert_cmd = "2"
walkdir = "2"
